<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>声卡录音通道测试</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Microsoft YaHei", sans-serif; max-width: 780px; margin: 28px auto; padding: 0 18px; background: #f0f2f5; color: #1c1e21; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { font-size: 13px; color: #7a7f87; margin-bottom: 18px; }
  .card { background: #fff; border-radius: 10px; padding: 16px 18px; box-shadow: 0 1px 4px rgba(0,0,0,.07); margin-bottom: 14px; }
  label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; font-weight: 600; }
  select { width: 100%; padding: 8px 10px; font-size: 14px; border: 1px solid #ccd0d6; border-radius: 6px; }
  select:disabled { background: #f3f4f6; color: #999; }
  button { padding: 9px 16px; font-size: 14px; border: none; border-radius: 6px; cursor: pointer; background: #2b7cff; color: #fff; }
  button:disabled { background: #c3cddb; cursor: not-allowed; }
  button.sec { background: #eceff3; color: #333; }
  button.stop { background: #e5484d; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .info { font-size: 13px; color: #666; line-height: 1.9; margin-top: 10px; }
  .badge { display: inline-block; background: #eef3ff; color: #2b7cff; border-radius: 4px; padding: 1px 8px; font-size: 12px; margin: 0 6px 0 0; font-weight: 600; }
  .status { font-size: 13px; margin-top: 10px; padding: 8px 10px; border-radius: 6px; display: none; line-height: 1.5; white-space: pre-wrap; }
  .status.err { display: block; background: #fff1f1; color: #b3261e; }
  .status.ok  { display: block; background: #eefaf0; color: #1a7f37; }
  .status.info{ display: block; background: #f4f6fb; color: #4a5568; }
  .meter { display: flex; align-items: center; gap: 10px; margin-bottom: 7px; }
  .meter .name { width: 46px; font-size: 12px; color: #444; font-weight: 600; }
  .meter .track { flex: 1; height: 14px; background: #e9ecf1; border-radius: 7px; overflow: hidden; }
  .meter .fill { height: 100%; width: 0%; background: linear-gradient(90deg,#39d353 0%,#39d353 55%,#e3b341 78%,#e5484d 100%); transition: width .06s linear; }
  .meter .db { width: 62px; text-align: right; font-size: 11px; color: #777; font-variant-numeric: tabular-nums; }
  canvas { width: 100%; height: 150px; display: block; border-radius: 8px; background: #0d1117; margin-top: 14px; }
  audio { width: 100%; margin-top: 6px; }
  a.dl { display: inline-block; padding: 9px 16px; border-radius: 6px; background: #1f9d55; color: #fff; text-decoration: none; font-size: 14px; margin-top: 10px; }
  pre.log { background: #0d1117; color: #c9d1d9; font-size: 12px; padding: 10px 12px; border-radius: 8px; max-height: 180px; overflow: auto; margin: 10px 0 0; line-height: 1.6; }
</style>
</head>
<body>

<h1>声卡录音通道测试</h1>
<div class="sub">选择指定声卡 / 音频输入设备，按通道显示实时电平与波形，可导出多声道 WAV，用于验证录音通道是否正确。</div>

<div class="card">
  <label for="deviceSel">音频输入设备（声卡接口）</label>
  <select id="deviceSel"></select>
  <div class="row" style="margin-top:12px">
    <button id="refreshBtn" class="sec">刷新设备列表</button>
    <button id="startBtn" disabled>● 开始录音</button>
    <button id="stopBtn" class="stop" disabled>■ 停止并导出</button>
    <span id="timer" style="font-size:13px;color:#666;font-variant-numeric:tabular-nums">0.0 s</span>
  </div>
  <div id="status" class="status info"></div>
  <pre class="log" id="log"></pre>
</div>

<div class="card">
  <label>实时电平（按通道）</label>
  <div id="meters"><div style="font-size:13px;color:#999">尚未开始录音</div></div>
  <canvas id="wave" width="1400" height="300"></canvas>
</div>

<div class="card">
  <label>录音结果</label>
  <audio id="preview" controls></audio>
  <div id="dlWrap"></div>
</div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var COLORS = ['#2b7cff','#39d353','#e3b341','#e5484d','#a371f7','#3fb0ac','#f0883e','#db61a2'];

  var audioCtx = null, mediaStream = null, sourceNode = null;
  var splitterNode = null, scriptNode = null, muteGain = null;
  var analysers = [], chunkStore = [], numChannels = 0, sampleRate = 48000;
  var recording = false, startTime = 0, rafId = 0, timerId = 0, timeBuf = null;

  var deviceList = [];   // 保存设备列表，用索引访问

  var canvas = $('wave'), c2d = canvas.getContext('2d');

  /* ---------- 日志与状态 ---------- */
  function log(msg) {
    var el = $('log');
    var t = new Date().toTimeString().slice(0, 8);
    el.textContent += '[' + t + '] ' + msg + '\n';
    el.scrollTop = el.scrollHeight;
    console.log(msg);
  }
  function setStatus(msg, type) {
    var el = $('status');
    if (!msg) { el.className = 'status'; el.textContent = ''; return; }
    el.className = 'status ' + (type || 'info');
    el.textContent = msg;
  }

  function clearCanvas() {
    c2d.fillStyle = '#0d1117'; c2d.fillRect(0, 0, canvas.width, canvas.height);
    c2d.strokeStyle = '#21262d'; c2d.lineWidth = 1;
    c2d.beginPath(); c2d.moveTo(0, canvas.height / 2); c2d.lineTo(canvas.width, canvas.height / 2); c2d.stroke();
  }
  clearCanvas();

  /* ---------- 枚举设备 ---------- */
  function listDevices() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setStatus('当前环境不支持 mediaDevices，请用 HTTPS 或 localhost 打开。', 'err');
      return;
    }
    $('refreshBtn').disabled = true;
    setStatus('正在请求麦克风权限并枚举设备…', 'info');

    navigator.mediaDevices.getUserMedia({ audio: true })
      .then(function (tmp) {
        tmp.getTracks().forEach(function (t) { t.stop(); });
        return navigator.mediaDevices.enumerateDevices();
      })
      .then(function (devices) {
        deviceList = devices.filter(function (d) { return d.kind === 'audioinput'; });
        var sel = $('deviceSel');
        var prevIndex = sel.selectedIndex;
        sel.innerHTML = '';

        deviceList.forEach(function (d, i) {
          var o = document.createElement('option');
          // 关键：value 用索引，避免 deviceId 为空字符串导致判断失败
          o.value = String(i);
          var name = d.label || ('音频输入设备 ' + (i + 1));
          var extra = d.deviceId ? '' : '（默认设备）';
          o.textContent = name + extra;
          sel.appendChild(o);
        });

        if (prevIndex >= 0 && prevIndex < deviceList.length) sel.selectedIndex = prevIndex;

        $('startBtn').disabled = deviceList.length === 0;
        $('refreshBtn').disabled = false;
        setStatus(deviceList.length ? '已找到 ' + deviceList.length + ' 个输入设备，请选择后点击开始录音。'
                                    : '未检测到任何音频输入设备。', deviceList.length ? 'ok' : 'err');
        log('枚举到 ' + deviceList.length + ' 个 audioinput');
        deviceList.forEach(function (d, i) {
          log('  [' + i + '] label="' + (d.label || '') + '" deviceId="' + (d.deviceId || '(空)') + '"');
        });
      })
      .catch(function (err) {
        $('refreshBtn').disabled = false;
        setStatus('获取麦克风权限失败：' + err.name + ' - ' + err.message, 'err');
        log('getUserMedia 失败: ' + err.name + ' ' + err.message);
      });
  }

  /* ---------- 开始录音 ---------- */
  function startRecording() {
    // 关键：用 selectedIndex 判断，而不是 value 是否为空
    var sel = $('deviceSel');
    var idx = sel.selectedIndex;
    if (idx < 0 || idx >= deviceList.length) {
      setStatus('请先选择设备。', 'err');
      return;
    }
    var device = deviceList[idx];
    var deviceId = device.deviceId;

    $('dlWrap').innerHTML = '';
    $('preview').removeAttribute('src');
    $('timer').textContent = '0.0 s';
    setStatus('正在打开设备…', 'info');
    log('选中 [' + idx + '] label="' + (device.label || '') + '" deviceId="' + (deviceId || '(空)') + '"');

    // 如果 deviceId 为空，不传 deviceId 约束，使用默认设备
    var audioConstraints = {
      echoCancellation: false,
      noiseSuppression: false,
      autoGainControl: false
    };
    if (deviceId) {
      audioConstraints.deviceId = { exact: deviceId };
    } else {
      log('deviceId 为空，使用默认音频输入设备');
    }

    navigator.mediaDevices.getUserMedia({ audio: audioConstraints })
    .then(function (stream) {
      mediaStream = stream;
      var track = stream.getAudioTracks()[0];
      var settings = track.getSettings ? track.getSettings() : {};
      log('设备已打开: ' + (track.label || '(无名称)'));
      log('settings = ' + JSON.stringify(settings));

      setStatus('正在初始化音频引擎…', 'info');

      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var resumeP = audioCtx.state === 'suspended' ? audioCtx.resume() : Promise.resolve();
      return resumeP.then(function () {
        sampleRate = audioCtx.sampleRate;
        log('AudioContext: ' + sampleRate + ' Hz, state=' + audioCtx.state +
            ', destination.maxChannelCount=' + audioCtx.destination.maxChannelCount);

        sourceNode = audioCtx.createMediaStreamSource(mediaStream);
        log('sourceNode.channelCount = ' + sourceNode.channelCount);

        var detected = settings.channelCount || sourceNode.channelCount || 1;
        numChannels = Math.max(1, Math.min(8, detected));
        log('最终使用声道数 = ' + numChannels);

        buildGraph();
      });
    })
    .catch(function (err) {
      var hint = '';
      if (err.name === 'NotAllowedError') hint = '\n提示：请检查浏览器地址栏左侧的麦克风权限是否被拒绝。';
      else if (err.name === 'NotFoundError') hint = '\n提示：设备可能已被拔出，请点“刷新设备列表”。';
      else if (err.name === 'OverconstrainedError') hint = '\n提示：deviceId 已失效，请重新选择设备。';
      else if (err.name === 'NotReadableError') hint = '\n提示：设备被其他程序占用（如会议软件）。';
      setStatus('开始录音失败：' + err.name + ' - ' + err.message + hint, 'err');
      log('开始录音失败: ' + err.name + ' ' + err.message);
      cleanup();
    });
  }

  /* ---------- 构建音频图 ---------- */
  function buildGraph() {
    try {
      splitterNode = audioCtx.createChannelSplitter(numChannels);
      sourceNode.connect(splitterNode);

      analysers = [];
      var metersEl = $('meters');
      metersEl.innerHTML = '';

      for (var i = 0; i < numChannels; i++) {
        var an = audioCtx.createAnalyser();
        an.fftSize = 2048;
        an.smoothingTimeConstant = 0.25;
        splitterNode.connect(an, i, 0);
        analysers.push(an);

        var row = document.createElement('div');
        row.className = 'meter';
        row.innerHTML =
          '<span class="name">CH ' + (i + 1) + '</span>' +
          '<div class="track"><div class="fill" id="fill-' + i + '"></div></div>' +
          '<span class="db" id="db-' + i + '">-∞</span>';
        metersEl.appendChild(row);
      }
      timeBuf = new Float32Array(analysers[0].fftSize);
      log('已创建 ' + numChannels + ' 个分析器');

      chunkStore = [];
      for (var c = 0; c < numChannels; c++) chunkStore.push([]);

      scriptNode = audioCtx.createScriptProcessor(4096, numChannels, numChannels);
      scriptNode.onaudioprocess = function (e) {
        if (!recording) return;
        var input = e.inputBuffer;
        for (var ch = 0; ch < numChannels; ch++) {
          chunkStore[ch].push(new Float32Array(input.getChannelData(ch)));
        }
      };
      sourceNode.connect(scriptNode);

      muteGain = audioCtx.createGain();
      muteGain.gain.value = 0;
      scriptNode.connect(muteGain);
      muteGain.connect(audioCtx.destination);
      log('ScriptProcessorNode 已连接（输出经静音 GainNode 到 destination）');

      recording = true;
      startTime = performance.now();

      $('startBtn').disabled = true;
      $('stopBtn').disabled = false;
      $('refreshBtn').disabled = true;
      $('deviceSel').disabled = true;

      var track = mediaStream.getAudioTracks()[0];
      $('status').className = 'status ok';
      $('status').innerHTML =
        '录音中：<b>' + escapeHtml(track.label || '') + '</b>\n' +
        '<span class="badge">' + sampleRate + ' Hz</span>' +
        '<span class="badge">' + numChannels + ' 声道</span>' +
        '<span class="badge">16-bit PCM WAV</span>';

      timerId = setInterval(tickTimer, 100);
      drawLoop();
    } catch (err) {
      setStatus('构建音频图失败：' + err.name + ' - ' + err.message, 'err');
      log('buildGraph 异常: ' + (err.stack || err.message));
      cleanup();
    }
  }

  /* ---------- 停止 ---------- */
  function stopRecording() {
    if (!recording) return;
    recording = false;
    clearInterval(timerId);
    cancelAnimationFrame(rafId);

    var merged = chunkStore.map(function (chunks) {
      var total = 0, i;
      for (i = 0; i < chunks.length; i++) total += chunks[i].length;
      var out = new Float32Array(total), off = 0;
      for (i = 0; i < chunks.length; i++) { out.set(chunks[i], off); off += chunks[i].length; }
      return out;
    });

    if (merged.length && merged[0].length > 0) {
      var blob = encodeWAV(merged, sampleRate);
      var url = URL.createObjectURL(blob);
      $('preview').src = url;
      var sizeMB = (blob.size / 1048576).toFixed(2);
      var sec = (merged[0].length / sampleRate).toFixed(1);
      $('dlWrap').innerHTML =
        '<a class="dl" download="rec_' + numChannels + 'ch_' + sampleRate + 'Hz.wav" href="' + url + '">' +
        '⬇ 下载 WAV（' + numChannels + ' 声道 / ' + sec + ' 秒 / ' + sizeMB + ' MB）</a>';
      log('已生成 WAV: ' + numChannels + ' 声道, ' + sec + ' 秒, ' + sizeMB + ' MB');
    } else {
      $('dlWrap').innerHTML = '<div style="color:#b3261e;font-size:13px;margin-top:8px">未采集到任何数据。</div>';
      log('警告：chunkStore 为空');
    }

    cleanup();
    $('startBtn').disabled = false;
    $('stopBtn').disabled = true;
    $('refreshBtn').disabled = false;
    $('deviceSel').disabled = false;
    clearCanvas();
    setStatus('已停止。可试听或下载 WAV 检查各通道。', 'info');
  }

  function cleanup() {
    try { if (sourceNode) sourceNode.disconnect(); } catch (e) {}
    try { if (splitterNode) splitterNode.disconnect(); } catch (e) {}
    try { if (scriptNode) { scriptNode.onaudioprocess = null; scriptNode.disconnect(); } } catch (e) {}
    try { if (muteGain) muteGain.disconnect(); } catch (e) {}
    analysers.forEach(function (a) { try { a.disconnect(); } catch (e) {} });
    analysers = [];
    if (mediaStream) { mediaStream.getTracks().forEach(function (t) { t.stop(); }); mediaStream = null; }
    if (audioCtx) { audioCtx.close().catch(function () {}); audioCtx = null; }
    sourceNode = splitterNode = scriptNode = muteGain = null;
  }

  /* ---------- 渲染 ---------- */
  function tickTimer() {
    $('timer').textContent = ((performance.now() - startTime) / 1000).toFixed(1) + ' s';
  }

  function drawLoop() {
    if (!recording) return;
    var W = canvas.width, H = canvas.height;
    c2d.fillStyle = '#0d1117'; c2d.fillRect(0, 0, W, H);
    c2d.strokeStyle = '#21262d'; c2d.lineWidth = 1;
    c2d.beginPath(); c2d.moveTo(0, H / 2); c2d.lineTo(W, H / 2); c2d.stroke();

    for (var i = 0; i < analysers.length; i++) {
      var an = analysers[i];
      an.getFloatTimeDomainData(timeBuf);

      var sum = 0;
      for (var k = 0; k < timeBuf.length; k++) sum += timeBuf[k] * timeBuf[k];
      var rms = Math.sqrt(sum / timeBuf.length);
      var db = rms > 1e-7 ? 20 * Math.log10(rms) : -140;
      var pct = Math.max(0, Math.min(100, (db + 60) / 60 * 100));

      var fill = document.getElementById('fill-' + i);
      var dbEl = document.getElementById('db-' + i);
      if (fill) fill.style.width = pct.toFixed(1) + '%';
      if (dbEl) dbEl.textContent = db <= -100 ? '-∞' : db.toFixed(1) + ' dB';

      c2d.strokeStyle = COLORS[i % COLORS.length];
      c2d.lineWidth = 2;
      c2d.beginPath();
      var step = timeBuf.length / W;
      for (var x = 0; x < W; x++) {
        var v = timeBuf[Math.floor(x * step)] || 0;
        var y = H / 2 - v * (H / 2 - 8);
        if (x === 0) c2d.moveTo(x, y); else c2d.lineTo(x, y);
      }
      c2d.stroke();
    }

    c2d.font = '22px sans-serif';
    var lx = 14;
    for (var j = 0; j < analysers.length; j++) {
      c2d.fillStyle = COLORS[j % COLORS.length];
      c2d.fillRect(lx, 12, 22, 22);
      c2d.fillStyle = '#c9d1d9';
      c2d.fillText('CH' + (j + 1), lx + 28, 31);
      lx += 100;
    }

    rafId = requestAnimationFrame(drawLoop);
  }

  /* ---------- WAV 编码 ---------- */
  function encodeWAV(channelData, rate) {
    var numCh = channelData.length, frames = 0, i;
    for (i = 0; i < numCh; i++) frames = Math.max(frames, channelData[i].length);

    var blockAlign = numCh * 2, dataSize = frames * blockAlign;
    var buf = new ArrayBuffer(44 + dataSize);
    var view = new DataView(buf);

    function wstr(off, s) { for (var k = 0; k < s.length; k++) view.setUint8(off + k, s.charCodeAt(k)); }

    wstr(0, 'RIFF'); view.setUint32(4, 36 + dataSize, true); wstr(8, 'WAVE');
    wstr(12, 'fmt '); view.setUint32(16, 16, true);
    view.setUint16(20, 1, true); view.setUint16(22, numCh, true);
    view.setUint32(24, rate, true); view.setUint32(28, rate * blockAlign, true);
    view.setUint16(32, blockAlign, true); view.setUint16(34, 16, true);
    wstr(36, 'data'); view.setUint32(40, dataSize, true);

    var off = 44;
    for (var f = 0; f < frames; f++) {
      for (var ch = 0; ch < numCh; ch++) {
        var arr = channelData[ch];
        var s = f < arr.length ? arr[f] : 0;
        if (s > 1) s = 1; else if (s < -1) s = -1;
        view.setInt16(off, s < 0 ? s * 0x8000 : s * 0x7fff, true);
        off += 2;
      }
    }
    return new Blob([buf], { type: 'audio/wav' });
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /* ---------- 绑定 ---------- */
  $('refreshBtn').addEventListener('click', listDevices);
  $('startBtn').addEventListener('click', startRecording);
  $('stopBtn').addEventListener('click', stopRecording);

  if (navigator.mediaDevices && navigator.mediaDevices.addEventListener) {
    navigator.mediaDevices.addEventListener('devicechange', function () {
      if (!recording) listDevices();
    });
  }
  window.addEventListener('beforeunload', function () { if (recording) stopRecording(); });

  listDevices();
})();
</script>
</body>
</html>
